# Deploys the database migrations and Edge Functions to the online Supabase project.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token  (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the project's database password
# The web app itself is deployed by Cloudflare from `main`.
name: Deploy Supabase

on:
  push:
    branches: [main, main-jdj75c]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xllxxgfkxeuzwbtfgpsg
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Link project
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations to apply
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply migrations
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        run: npx supabase functions deploy ocr-agent --no-verify-jwt --use-api --project-ref "$PROJECT_REF"
